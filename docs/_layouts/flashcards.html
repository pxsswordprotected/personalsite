---
---
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }}</title>
  <link
    rel="preload"
    href="/assets/fonts/PPNeueMontreal-Book.woff2"
    as="font"
    type="font/woff2"
    crossorigin
  />
  <link rel="stylesheet" href="/assets/flashcards/bundle.css" />
  <link rel="stylesheet" href="/assets/css/colors.css" />
  <style>
    @font-face {
      font-family: "PPNeueMontreal-Book";
      src:
        url(/assets/fonts/PPNeueMontreal-Book.woff2) format("woff2"),
        url(/assets/fonts/PPNeueMontreal-Book.woff) format("woff");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    html {
      padding: clamp(1rem, 3vh, 2rem);
      min-height: 100vh;
      overflow-y: scroll;
    }
    body {
      margin: 0;
      background: #fdfdfd;
      font-family: "PPNeueMontreal-Book", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: #0d0d0f;
      min-height: 100vh;
    }
    .fc-home:hover {
      opacity: 1;
      color: var(--signature-blue);
    }
    .fc-home::after {
      content: "\2212";
      display: inline-block;
      visibility: hidden;
      margin-left: 4px;
      color: #191919;
    }
    .fc-home:hover::after,
    .fc-home:focus-visible::after {
      visibility: visible;
    }
    @media (min-width: 48rem) {
      html {
        padding: calc(1rem * 2);
      }
    }
  </style>
</head>
<body>
  {{ content }}
  <div id="flashcards-root"></div>
  <script type="module" src="/assets/flashcards/bundle.js"></script>
</body>
</html>
