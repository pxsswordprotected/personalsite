<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{ page.title }}</title>
        <link rel="stylesheet" href="/assets/css/type-scale.css" />
        <style>
            @font-face {
                font-family: "PPNeueMontreal-Book";
                src:
                    url(/assets/fonts/PPNeueMontreal-Book.woff2) format("woff2"),
                    url(/assets/fonts/PPNeueMontreal-Book.woff) format("woff");
                font-weight: 400;
                font-style: normal;
                font-display: swap;
            }

            :root {
                --section-margin-size: clamp(0.75rem, 24px, 2rem);
                --intro-margin-size: clamp(1.5rem, 2vh, 3rem);
                --text-color-500: #191919;
                --bg-color-light-500: #fdfdfd;
            }

            html {
                padding: clamp(1rem, 3vh, 2rem);
                min-height: 100vh;
                overflow-y: scroll;
                font-family:
                    "PPNeueMontreal-Book",
                    system-ui,
                    -apple-system,
                    Segoe UI,
                    Roboto,
                    Arial,
                    sans-serif;
                box-sizing: border-box;
                color: var(--text-color-500);
                background-color: var(--bg-color-light-500);
                letter-spacing: 0.025rem;
            }

            *,
            *::before,
            *::after {
                box-sizing: inherit;
            }

            body {
                margin: 0;
            }

            /* Top home button */
            .home-button-top {
                display: inline-block;
                font-size: var(--font-size-body);
                text-decoration: underline;
                color: var(--text-color-500);
                margin-bottom: var(--intro-margin-size);
            }

            .home-button-top:hover {
                opacity: 0.7;
            }

            ::selection {
                background-color: var(--text-color-500);
                color: var(--bg-color-light-500);
            }

            /* Main container */
            .post-container {
                max-width: 60ch;
                margin-inline: auto;
                min-height: calc(100vh - (2 * clamp(1rem, 3vh, 2rem)));
            }

            /* Title styling */
            .post-title {
                margin-top: 0;
                margin-bottom: clamp(1rem, 2vh, 1.5rem);
                font-size: var(--font-size-heading);
                font-weight: normal;
            }

            /* Published date styling */
            .post-date {
                margin: 0 0 var(--section-margin-size) 0;
                color: var(--text-color-500);
                font-size: var(--font-size-body);
                opacity: 0.75;
            }

            /* Main post content */
            .post-content {
                line-height: 1.6;
            }

            .post-content h1,
            .post-content h2 {
                font-size: var(--font-size-heading);
            }

            .post-content h3,
            .post-content h4,
            .post-content h5,
            .post-content h6 {
                font-size: var(--font-size-body);
            }

            .post-content p {
                margin-bottom: clamp(1rem, 3vh, 1.5rem);
            }

            .post-content img {
                max-width: 100%;
                height: auto;
                display: block;
            }

            .post-content a {
                color: var(--text-color-500);
                text-decoration: underline;
            }

            .post-content a:visited {
                color: rgb(78, 78, 78);
            }

            .post-content a:hover {
                opacity: 0.7;
            }

            a:focus-visible {
                outline: 2px solid currentColor;
                outline-offset: 2px;
            }

            /* Desktop adjustments */
            @media (min-width: 48rem) {

                html {
                    padding: calc(1rem * 2);
                }
            }
        </style>
    </head>
    <body>
        <div class="post-container">
            <a href="{{ site.baseurl }}/my_writing/" class="home-button-top"
                >Writing</a
            >

            <article>
                <header>
                    <h1 class="post-title">{{ page.title }}</h1>
                    <div class="post-date">
                        Published: {{ page.date | date: "%B %d, %Y" }}
                    </div>
                </header>

                <div class="post-content">{{ content }}</div>
            </article>
        </div>
    </body>
</html>
